<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu her</title>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
        }
        
        .menu-container {
            background: #1e2a3a;
            padding: 3rem 4rem;
            border-radius: 3rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        
        h1 {
            color: #f0e9d8;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }
        
        .play-button {
            background: #facc15;
            border: none;
            color: #0b0f1a;
            font-weight: 700;
            font-size: 1.5rem;
            padding: 0.8rem 3rem;
            border-radius: 60px;
            box-shadow: 0 8px 0 #a07c0e, 0 6px 18px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.07s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .play-button:hover {
            transform: scale(1.05);
        }
        
        .play-button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #a07c0e;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h1>🎮 Výběr hry</h1>
        
        <!-- TLAČÍTKO PRO PŘESMĚROVÁNÍ NA hra.html -->
        <a href="hra.html" class="play-button">▶ Spustit hru</a>
        
        <p style="color: #94a3b8; margin-top: 1.5rem;">
            Kliknutím spustíš běhačku
        </p>
    </div>
</body>
</html>
