<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tetris - mobilní verze</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 0.5rem;
            overflow: hidden;
            touch-action: none;
            margin: 0;
        }

        .game-wrapper {
            background: #1e2a3a;
            padding: 0.8rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            width: 100%;
            max-width: 420px;
        }

        h1 {
            color: #f0e9d8;
            font-weight: 500;
            font-size: 1.4rem;
            letter-spacing: 3px;
            text-shadow: 0 3px 0 #0b0f1a;
            margin-bottom: 0.2rem;
        }
        h1 span {
            color: #facc15;
        }

        /* ----- HLAVNÍ HERNÍ PLOCHA + PANEL VEDLE ----- */
        .game-row {
            display: flex;
            gap: 0.8rem;
            align-items: stretch;
            width: 100%;
            justify-content: center;
        }

        canvas#gameCanvas {
            display: block;
            background: #0b1622;
            border-radius: 1.2rem;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 0 2px #334155;
            width: 100%;
            max-width: 240px;
            height: auto;
            aspect-ratio: 10 / 20;
            image-rendering: pixelated;
            touch-action: none;
            flex-shrink: 0;
        }

        .side-panel {
            background: #0f1a2a;
            border-radius: 1.2rem;
            padding: 0.6rem 0.8rem;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 0 0 1px #2a3a4e;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            flex: 1;
            min-width: 80px;
            justify-content: center;
        }

        .side-panel .label {
            color: #94a3b8;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .side-panel .value {
            color: #facc15;
            font-size: 1.2rem;
            font-weight: 700;
            background: #0b1622;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            min-width: 40px;
            text-align: center;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .side-panel .value.lives {
            color: #ef4444;
        }

        canvas#previewCanvas {
            display: block;
            background: #0b1622;
            border-radius: 0.8rem;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6), 0 0 0 1px #2a3a4e;
            width: 100%;
            max-width: 70px;
            height: auto;
            aspect-ratio: 1 / 1;
            image-rendering: pixelated;
        }

        /* ----- SKVĚLÁ DOTYKOVÁ TLAČÍTKA (mobil) ----- */
        .touch-controls {
            display: none;
            gap: 0.4rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 1.8rem;
            padding: 0.6rem 0;
            border-radius: 1rem;
            min-width: 50px;
            min-height: 55px;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.08s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4);
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .touch-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.25);
        }

        .touch-btn.left-btn {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.4);
        }
        .touch-btn.left-btn:active {
            background: rgba(59, 130, 246, 0.6);
        }

        .touch-btn.right-btn {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.4);
        }
        .touch-btn.right-btn:active {
            background: rgba(59, 130, 246, 0.6);
        }

        .touch-btn.rotate-btn {
            background: rgba(168, 85, 247, 0.3);
            border-color: rgba(168, 85, 247, 0.4);
            flex: 1.5;
            font-size: 2rem;
        }
        .touch-btn.rotate-btn:active {
            background: rgba(168, 85, 247, 0.6);
        }

        .touch-btn.drop-btn {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.4);
            flex: 1.5;
            font-size: 1.4rem;
        }
        .touch-btn.drop-btn:active {
            background: rgba(239, 68, 68, 0.6);
        }

        .touch-btn.down-btn {
            background: rgba(34, 197, 94, 0.25);
            border-color: rgba(34, 197, 94, 0.35);
        }
        .touch-btn.down-btn:active {
            background: rgba(34, 197, 94, 0.5);
        }

        /* Zobrazit tlačítka POUZE na mobilu */
        @media (hover: none) and (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
        }

        /* Řada tlačítek - 3 sloupce */
        .touch-row {
            display: flex;
            gap: 0.4rem;
            width: 100%;
        }

        /* Tlačítka menu */
        .controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        button {
            background: #facc15;
            border: none;
            color: #0b0f1a;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            box-shadow: 0 5px 0 #a07c0e, 0 6px 18px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.07s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            touch-action: manipulation;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #a07c0e;
        }

        .back-button {
            background: #64748b;
            box-shadow: 0 5px 0 #475569, 0 6px 18px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            color: #0b0f1a;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 0.3rem 0.9rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.07s ease;
            border: none;
        }
        .back-button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #475569;
        }

        .status {
            color: #94a3b8;
            font-size: 0.7rem;
            min-height: 1.2rem;
            font-weight: 300;
            text-align: center;
            margin-top: 0.2rem;
            width: 100%;
        }

        /* Skrýt hint na mobilu */
        @media (hover: none) and (pointer: coarse) {
            .hint {
                display: none;
            }
        }

        .hint {
            color: #64748b;
            font-size: 0.6rem;
            text-align: center;
            margin-top: 0.1rem;
        }

        .hint kbd {
            background: #0b1622;
            padding: 0.05rem 0.4rem;
            border-radius: 6px;
            color: #cbd5e1;
            border: 1px solid #334155;
            font-size: 0.55rem;
        }

        /* Responzivita */
        @media (max-width: 450px) {
            .game-wrapper {
                padding: 0.5rem;
                border-radius: 1.5rem;
            }
            h1 {
                font-size: 1.1rem;
            }
            canvas#gameCanvas {
                max-width: 180px;
            }
            .side-panel {
                padding: 0.4rem 0.5rem;
                min-width: 60px;
            }
            .side-panel .value {
                font-size: 1rem;
                min-width: 30px;
                padding: 0.05rem 0.4rem;
            }
            .side-panel .label {
                font-size: 0.45rem;
            }
            canvas#previewCanvas {
                max-width: 50px;
            }
            .touch-btn {
                font-size: 1.4rem;
                min-width: 35px;
                min-height: 40px;
                padding: 0.4rem 0;
            }
            .touch-btn.rotate-btn {
                font-size: 1.5rem;
            }
            .touch-btn.drop-btn {
                font-size: 1.1rem;
            }
            button {
                font-size: 0.65rem;
                padding: 0.2rem 0.7rem;
            }
            .back-button {
                font-size: 0.6rem;
                padding: 0.2rem 0.7rem;
            }
            .game-row {
                gap: 0.5rem;
            }
        }

        @media (max-width: 360px) {
            canvas#gameCanvas {
                max-width: 140px;
            }
            .side-panel {
                padding: 0.3rem 0.4rem;
                min-width: 50px;
            }
            .side-panel .value {
                font-size: 0.8rem;
                min-width: 25px;
            }
            canvas#previewCanvas {
                max-width: 40px;
            }
            .touch-btn {
                font-size: 1.1rem;
                min-width: 28px;
                min-height: 32px;
                padding: 0.3rem 0;
            }
            .touch-btn.rotate-btn {
                font-size: 1.2rem;
            }
        }

        @media (min-width: 601px) {
            .touch-controls {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <h1>🧩 <span>TETRIS</span></h1>

    <div class="game-row">
        <canvas id="gameCanvas" width="300" height="600"></canvas>

        <div class="side-panel">
            <div>
                <div class="label">🎯 Skóre</div>
                <div class="value" id="scoreDisplay">0</div>
            </div>
            <div>
                <div class="label">📊 Level</div>
                <div class="value" id="levelDisplay">1</div>
            </div>
            <div>
                <div class="label">🧹 Řádky</div>
                <div class="value" id="linesDisplay">0</div>
            </div>
            <div>
                <div class="label">🔮 Další</div>
                <canvas id="previewCanvas" width="120" height="120"></canvas>
            </div>
        </div>
    </div>

    <!-- DOTYKOVÁ TLAČÍTKA (mobil) -->
    <div class="touch-controls" id="touchControls">
        <div class="touch-row">
            <button class="touch-btn left-btn" id="touchLeft">◀</button>
            <button class="touch-btn rotate-btn" id="touchRotate">🔄</button>
            <button class="touch-btn right-btn" id="touchRight">▶</button>
        </div>
        <div class="touch-row">
            <button class="touch-btn down-btn" id="touchDown">▼</button>
            <button class="touch-btn drop-btn" id="touchDrop">⬇⬇</button>
        </div>
    </div>

    <div class="controls">
        <button id="restartBtn">🔄 Nová</button>
        <button id="pauseBtn">⏸ Pauza</button>
        <a href="hry.html" class="back-button">⬅ Zpět</a>
    </div>
    <div class="status" id="statusMsg">Použij šipky pro pohyb</div>
    <div class="hint">
        <kbd>←</kbd> <kbd>→</kbd> pohyb &nbsp;·&nbsp; <kbd>↑</kbd> otoč &nbsp;·&nbsp; <kbd>↓</kbd> zrychli &nbsp;·&nbsp; <kbd>P</kbd> pauza
    </div>
</div>

<script>
    (function() {
        // ----- DOM -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');

        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const linesDisplay = document.getElementById('linesDisplay');
        const statusMsg = document.getElementById('statusMsg');

        const restartBtn = document.getElementById('restartBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        // Dotyková tlačítka
        const touchLeft = document.getElementById('touchLeft');
        const touchRight = document.getElementById('touchRight');
        const touchDown = document.getElementById('touchDown');
        const touchRotate = document.getElementById('touchRotate');
        const touchDrop = document.getElementById('touchDrop');

        // ----- Konfigurace -----
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const W = 300;
        const H = 600;

        // ----- Tvary -----
        const SHAPES = {
            I: { blocks: [[1,1,1,1]], color: '#3b82f6' },
            O: { blocks: [[1,1],[1,1]], color: '#facc15' },
            T: { blocks: [[0,1,0],[1,1,1]], color: '#a855f7' },
            S: { blocks: [[0,1,1],[1,1,0]], color: '#22c55e' },
            Z: { blocks: [[1,1,0],[0,1,1]], color: '#ef4444' },
            J: { blocks: [[1,0,0],[1,1,1]], color: '#3b82f6' },
            L: { blocks: [[0,0,1],[1,1,1]], color: '#f97316' }
        };
        const SHAPE_NAMES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

        // ----- Stav -----
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = false;
        let paused = false;
        let dropInterval = null;
        let animationFrame = null;

        // ----- Inicializace -----
        function initBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board.push(new Array(COLS).fill(0));
            }
        }

        function randomPiece() {
            const name = SHAPE_NAMES[Math.floor(Math.random() * SHAPE_NAMES.length)];
            const shape = SHAPES[name];
            return {
                name: name,
                blocks: shape.blocks.map(row => [...row]),
                color: shape.color,
                x: Math.floor((COLS - shape.blocks[0].length) / 2),
                y: 0
            };
        }

        function spawnPiece() {
            if (!nextPiece) nextPiece = randomPiece();
            currentPiece = {
                name: nextPiece.name,
                blocks: nextPiece.blocks.map(row => [...row]),
                color: nextPiece.color,
                x: Math.floor((COLS - nextPiece.blocks[0].length) / 2),
                y: 0
            };
            nextPiece = randomPiece();
            drawPreview();

            if (collides(currentPiece.blocks, currentPiece.x, currentPiece.y)) {
                gameOver = true;
                statusMsg.textContent = '💀 KONEC! Klikni "Nová".';
                if (dropInterval) { clearInterval(dropInterval);
                    dropInterval = null; }
                return false;
            }
            return true;
        }

        function collides(blocks, ox, oy) {
            for (let r = 0; r < blocks.length; r++) {
                for (let c = 0; c < blocks[0].length; c++) {
                    if (blocks[r][c] !== 0) {
                        const bx = ox + c,
                            by = oy + r;
                        if (bx < 0 || bx >= COLS || by >= ROWS || by < 0) return true;
                        if (by >= 0 && board[by][bx] !== 0) return true;
                    }
                }
            }
            return false;
        }

        function rotateBlocks(blocks) {
            const rows = blocks.length,
                cols = blocks[0].length;
            const rotated = [];
            for (let c = 0; c < cols; c++) {
                rotated.push([]);
                for (let r = rows - 1; r >= 0; r--) rotated[c].push(blocks[r][c]);
            }
            return rotated;
        }

        function lockPiece() {
            if (!currentPiece) return;
            for (let r = 0; r < currentPiece.blocks.length; r++) {
                for (let c = 0; c < currentPiece.blocks[0].length; c++) {
                    if (currentPiece.blocks[r][c] !== 0) {
                        const bx = currentPiece.x + c,
                            by = currentPiece.y + r;
                        if (by >= 0 && by < ROWS && bx >= 0 && bx < COLS) {
                            board[by][bx] = currentPiece.color;
                        }
                    }
                }
            }
            clearLines();
            const success = spawnPiece();
            if (!success) {
                gameOver = true;
                statusMsg.textContent = '💀 KONEC! Klikni "Nová".';
                if (dropInterval) { clearInterval(dropInterval);
                    dropInterval = null; }
            }
            draw();
        }

        function clearLines() {
            let cleared = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(new Array(COLS).fill(0));
                    cleared++;
                    r++;
                }
            }
            if (cleared > 0) {
                lines += cleared;
                const points = [0, 100, 300, 500, 800];
                const addScore = points[Math.min(cleared, 4)] * level;
                score += addScore;
                level = Math.floor(lines / 10) + 1;
                updateDisplay();
                updateDropSpeed();
                statusMsg.textContent = `🧹 +${cleared} řádky! +${addScore} b.`;
                setTimeout(() => {
                    if (!gameOver && !paused) statusMsg.textContent = 'Pokračuj! 🎮';
                }, 1000);
            }
        }

        function updateDropSpeed() {
            if (dropInterval) { clearInterval(dropInterval);
                dropInterval = null; }
            if (gameOver || paused) return;
            const speed = Math.max(50, 600 - (level - 1) * 50);
            dropInterval = setInterval(() => {
                if (!paused && !gameOver && currentPiece) moveDown();
            }, speed);
        }

        // ----- Pohyb -----
        function moveDown() {
            if (!currentPiece || gameOver || paused) return;
            if (!collides(currentPiece.blocks, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
                draw();
            } else {
                lockPiece();
                draw();
            }
        }

        function moveLeft() {
            if (!currentPiece || gameOver || paused) return;
            if (!collides(currentPiece.blocks, currentPiece.x - 1, currentPiece.y)) {
                currentPiece.x--;
                draw();
            }
        }

        function moveRight() {
            if (!currentPiece || gameOver || paused) return;
            if (!collides(currentPiece.blocks, currentPiece.x + 1, currentPiece.y)) {
                currentPiece.x++;
                draw();
            }
        }

        function rotatePiece() {
            if (!currentPiece || gameOver || paused) return;
            const rotated = rotateBlocks(currentPiece.blocks);
            if (!collides(rotated, currentPiece.x, currentPiece.y)) {
                currentPiece.blocks = rotated;
                draw();
            } else if (!collides(rotated, currentPiece.x - 1, currentPiece.y)) {
                currentPiece.blocks = rotated;
                currentPiece.x--;
                draw();
            } else if (!collides(rotated, currentPiece.x + 1, currentPiece.y)) {
                currentPiece.blocks = rotated;
                currentPiece.x++;
                draw();
            }
        }

        function hardDrop() {
            if (!currentPiece || gameOver || paused) return;
            while (!collides(currentPiece.blocks, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
            }
            lockPiece();
            draw();
        }

        // ----- Vykreslení -----
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Mřížka
            ctx.strokeStyle = 'rgba(60,90,120,0.12)';
            ctx.lineWidth = 0.5;
            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * BLOCK_SIZE);
                ctx.lineTo(W, r * BLOCK_SIZE);
                ctx.stroke();
            }
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * BLOCK_SIZE, 0);
                ctx.lineTo(c * BLOCK_SIZE, H);
                ctx.stroke();
            }
            // Board
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] !== 0) {
                        ctx.fillStyle = board[r][c];
                        ctx.shadowColor = board[r][c];
                        ctx.shadowBlur = 6;
                        ctx.fillRect(c * BLOCK_SIZE + 1, r * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(255,255,255,0.1)';
                        ctx.fillRect(c * BLOCK_SIZE + 2, r * BLOCK_SIZE + 2, BLOCK_SIZE - 8, 3);
                    }
                }
            }
            // Aktuální kus
            if (currentPiece && !gameOver) {
                const blocks = currentPiece.blocks;
                for (let r = 0; r < blocks.length; r++) {
                    for (let c = 0; c < blocks[0].length; c++) {
                        if (blocks[r][c] !== 0) {
                            const x = (currentPiece.x + c) * BLOCK_SIZE;
                            const y = (currentPiece.y + r) * BLOCK_SIZE;
                            ctx.fillStyle = currentPiece.color;
                            ctx.shadowColor = currentPiece.color;
                            ctx.shadowBlur = 10;
                            ctx.fillRect(x + 1, y + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = 'rgba(255,255,255,0.2)';
                            ctx.fillRect(x + 2, y + 2, BLOCK_SIZE - 8, 3);
                        }
                    }
                }
            }
            // Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fca5a5';
                ctx.font = 'bold 34px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', 150, 270);
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText('Klikni "Nová"', 150, 320);
            }
            // Pauza
            if (paused && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fde047';
                ctx.font = 'bold 36px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸', 150, 280);
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText('PAUZA', 150, 330);
            }
        }

        function drawPreview() {
            previewCtx.clearRect(0, 0, 120, 120);
            if (!nextPiece) return;
            const blocks = nextPiece.blocks;
            const bs = 22;
            const cols = blocks[0].length,
                rows = blocks.length;
            const ox = (120 - cols * bs) / 2,
                oy = (120 - rows * bs) / 2;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (blocks[r][c] !== 0) {
                        const x = ox + c * bs,
                            y = oy + r * bs;
                        previewCtx.fillStyle = nextPiece.color;
                        previewCtx.shadowColor = nextPiece.color;
                        previewCtx.shadowBlur = 8;
                        previewCtx.fillRect(x + 1, y + 1, bs - 2, bs - 2);
                        previewCtx.shadowBlur = 0;
                        previewCtx.fillStyle = 'rgba(255,255,255,0.15)';
                        previewCtx.fillRect(x + 2, y + 2, bs - 8, 3);
                    }
                }
            }
        }

        function updateDisplay() {
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            linesDisplay.textContent = lines;
        }

        // ----- Pauza -----
        function togglePause() {
            if (gameOver) return;
            paused = !paused;
            pauseBtn.textContent = paused ? '▶ Pokračovat' : '⏸ Pauza';
            statusMsg.textContent = paused ? '⏸ PAUZA' : '▶ Hra pokračuje';
            if (paused) {
                if (dropInterval) { clearInterval(dropInterval);
                    dropInterval = null; }
            } else {
                updateDropSpeed();
            }
            draw();
        }

        // ----- Nová hra -----
        function startNewGame() {
            if (dropInterval) { clearInterval(dropInterval);
                dropInterval = null; }
            if (animationFrame) { cancelAnimationFrame(animationFrame);
                animationFrame = null; }

            initBoard();
            score = 0;
            level = 1;
            lines = 0;
            gameOver = false;
            paused = false;
            pauseBtn.textContent = '⏸ Pauza';
            updateDisplay();
            statusMsg.textContent = '🎮 Nová hra!';

            nextPiece = randomPiece();
            spawnPiece();
            drawPreview();
            draw();
            updateDropSpeed();
        }

        // ----- Herní smyčka -----
        function gameLoop() {
            draw();
            animationFrame = requestAnimationFrame(gameLoop);
        }

        // ----- Klávesy -----
        function handleKeyDown(e) {
            const key = e.key;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'p', 'P'].includes(key)) {
                e.preventDefault();
            }
            if (key === 'p' || key === 'P') { togglePause(); return; }
            if (gameOver || paused) return;
            switch (key) {
                case 'ArrowLeft':
                    moveLeft();
                    break;
                case 'ArrowRight':
                    moveRight();
                    break;
                case 'ArrowDown':
                    moveDown();
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    break;
                case ' ':
                    hardDrop();
                    break;
            }
        }

        // ----- DOTYKOVÁ TLAČÍTKA (funkční) -----
        function setupTouchButton(btn, action, repeatable = false) {
            let intervalId = null;
            let timeoutId = null;

            function startAction(e) {
                e.preventDefault();
                e.stopPropagation();
                action();
                if (repeatable) {
                    timeoutId = setTimeout(() => {
                        intervalId = setInterval(action, 120);
                    }, 250);
                }
            }

            function stopAction(e) {
                e.preventDefault();
                e.stopPropagation();
                if (timeoutId) { clearTimeout(timeoutId);
                    timeoutId = null; }
                if (intervalId) { clearInterval(intervalId);
                    intervalId = null; }
            }

            // Dotyk
            btn.addEventListener('touchstart', startAction, { passive: false });
            btn.addEventListener('touchend', stopAction, { passive: false });
            btn.addEventListener('touchcancel', stopAction, { passive: false });

            // Myš (pro testování)
            btn.addEventListener('mousedown', startAction);
            btn.addEventListener('mouseup', stopAction);
            btn.addEventListener('mouseleave', stopAction);
        }

        // Nastavení tlačítek (opakovatelné = pohyb)
        setupTouchButton(touchLeft, moveLeft, true);
        setupTouchButton(touchRight, moveRight, true);
        setupTouchButton(touchDown, moveDown, true);

        // Rotace a drop - bez opakování
        touchRotate.addEventListener('click', (e) => { e.preventDefault();
            rotatePiece(); });
        touchRotate.addEventListener('touchstart', (e) => { e.preventDefault();
            rotatePiece(); }, { passive: false });

        touchDrop.addEventListener('click', (e) => { e.preventDefault();
            hardDrop(); });
        touchDrop.addEventListener('touchstart', (e) => { e.preventDefault();
            hardDrop(); }, { passive: false });

        // ----- Inicializace -----
        window.addEventListener('keydown', handleKeyDown);
        restartBtn.addEventListener('click', startNewGame);
        pauseBtn.addEventListener('click', togglePause);

        // Zákaz scrollování na tlačítkách
        document.querySelectorAll('.touch-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
        });

        startNewGame();
        gameLoop();

        window.addEventListener('blur', () => {});

        // Polyfill
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }
    })();
</script>
</body>
</html>
