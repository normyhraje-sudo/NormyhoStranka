<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tetris - mobil + PC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 0.5rem;
            overflow: hidden;
            touch-action: none;
        }

        .game-wrapper {
            background: #1e2a3a;
            padding: 1.2rem 1.5rem 1.5rem;
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 650px;
            width: 100%;
        }

        .main-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #f0e9d8;
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-shadow: 0 3px 0 #0b0f1a;
            margin-bottom: 0.3rem;
        }
        h1 span {
            color: #facc15;
        }

        canvas#gameCanvas {
            display: block;
            background: #0b1622;
            border-radius: 1.5rem;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 0 2px #334155;
            width: 100%;
            max-width: 280px;
            height: auto;
            aspect-ratio: 10 / 20;
            image-rendering: pixelated;
            touch-action: none;
        }

        .side-panel {
            background: #0f1a2a;
            border-radius: 1.8rem;
            padding: 1.2rem 1.5rem;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 0 0 1px #2a3a4e;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            min-width: 120px;
            flex-shrink: 0;
        }

        .side-panel .label {
            color: #94a3b8;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .side-panel .value {
            color: #facc15;
            font-size: 1.6rem;
            font-weight: 700;
            background: #0b1622;
            padding: 0.1rem 1rem;
            border-radius: 40px;
            min-width: 60px;
            text-align: center;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .side-panel .value.lives {
            color: #ef4444;
        }

        canvas#previewCanvas {
            display: block;
            background: #0b1622;
            border-radius: 1rem;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6), 0 0 0 1px #2a3a4e;
            width: 100%;
            max-width: 100px;
            height: auto;
            aspect-ratio: 1 / 1;
            image-rendering: pixelated;
        }

        /* ----- OVLÁDACÍ TLAČÍTKA (pouze na mobilu) ----- */
        .touch-controls {
            display: none;
            gap: 0.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 280px;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            font-size: 1.4rem;
            padding: 0.6rem 0.8rem;
            border-radius: 1rem;
            min-width: 50px;
            min-height: 50px;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        }

        .touch-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .touch-btn.rotate-btn {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.3);
            flex: 1.5;
        }

        .touch-btn.rotate-btn:active {
            background: rgba(168, 85, 247, 0.4);
        }

        .touch-btn.drop-btn {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
            flex: 1.5;
        }

        .touch-btn.drop-btn:active {
            background: rgba(239, 68, 68, 0.4);
        }

        /* Zobrazit tlačítka pouze na dotykových zařízeních */
        @media (hover: none) and (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
        }

        @media (max-width: 550px) {
            .touch-btn {
                font-size: 1.2rem;
                min-width: 40px;
                min-height: 40px;
                padding: 0.4rem 0.6rem;
            }
        }

        .controls {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        button {
            background: #facc15;
            border: none;
            color: #0b0f1a;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.35rem 1.2rem;
            border-radius: 60px;
            box-shadow: 0 6px 0 #a07c0e, 0 6px 18px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.07s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            touch-action: manipulation;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #a07c0e;
        }

        .back-button {
            background: #64748b;
            box-shadow: 0 6px 0 #475569, 0 6px 18px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            color: #0b0f1a;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.35rem 1rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.07s ease;
            border: none;
        }
        .back-button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #475569;
        }
        .back-button:hover {
            background: #94a3b8;
        }

        .status {
            color: #94a3b8;
            font-size: 0.8rem;
            min-height: 1.5rem;
            font-weight: 300;
            text-align: center;
            margin-top: 0.2rem;
            width: 100%;
        }

        .hint {
            color: #64748b;
            font-size: 0.65rem;
            text-align: center;
            margin-top: 0.1rem;
        }

        .hint kbd {
            background: #0b1622;
            padding: 0.05rem 0.5rem;
            border-radius: 6px;
            color: #cbd5e1;
            border: 1px solid #334155;
            font-size: 0.6rem;
        }

        @media (max-width: 600px) {
            .game-wrapper {
                padding: 1rem;
                border-radius: 2rem;
                gap: 1rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            .side-panel {
                padding: 0.8rem 1rem;
                min-width: 80px;
            }
            .side-panel .value {
                font-size: 1.2rem;
                min-width: 40px;
            }
            canvas#gameCanvas {
                max-width: 200px;
            }
            canvas#previewCanvas {
                max-width: 70px;
            }
            button {
                font-size: 0.75rem;
                padding: 0.25rem 0.9rem;
            }
            .back-button {
                font-size: 0.7rem;
                padding: 0.25rem 0.8rem;
            }
        }

        @media (max-width: 430px) {
            .game-wrapper {
                padding: 0.6rem;
                border-radius: 1.5rem;
                gap: 0.6rem;
            }
            canvas#gameCanvas {
                max-width: 160px;
            }
            .side-panel {
                padding: 0.5rem 0.6rem;
                min-width: 60px;
            }
            .side-panel .value {
                font-size: 1rem;
                min-width: 30px;
                padding: 0.05rem 0.5rem;
            }
            .side-panel .label {
                font-size: 0.55rem;
            }
            h1 {
                font-size: 1rem;
            }
            .touch-btn {
                font-size: 1rem;
                min-width: 32px;
                min-height: 32px;
                padding: 0.2rem 0.4rem;
            }
        }

        @media (min-width: 601px) {
            .touch-controls {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="main-area">
        <h1>🧩 <span>TETRIS</span></h1>
        <canvas id="gameCanvas" width="300" height="600"></canvas>

        <!-- DOTYKOVÉ OVLÁDÁNÍ (mobil) -->
        <div class="touch-controls" id="touchControls">
            <button class="touch-btn" id="touchLeft">◀</button>
            <button class="touch-btn rotate-btn" id="touchRotate">🔄</button>
            <button class="touch-btn" id="touchRight">▶</button>
            <button class="touch-btn drop-btn" id="touchDrop">⬇⬇</button>
        </div>

        <div class="controls">
            <button id="restartBtn">🔄 Nová</button>
            <button id="pauseBtn">⏸ Pauza</button>
            <a href="index.html" class="back-button">⬅ Zpět</a>
        </div>
        <div class="status" id="statusMsg">Použij šipky pro pohyb</div>
        <div class="hint">
            <kbd>←</kbd> <kbd>→</kbd> pohyb &nbsp;·&nbsp; <kbd>↑</kbd> otoč &nbsp;·&nbsp; <kbd>↓</kbd> zrychli &nbsp;·&nbsp; <kbd>P</kbd> pauza &nbsp;·&nbsp; <kbd>␣</kbd> drop
        </div>
    </div>

    <div class="side-panel">
        <div>
            <div class="label">🎯 Skóre</div>
            <div class="value" id="scoreDisplay">0</div>
        </div>
        <div>
            <div class="label">📊 Level</div>
            <div class="value" id="levelDisplay">1</div>
        </div>
        <div>
            <div class="label">🧹 Řádky</div>
            <div class="value" id="linesDisplay">0</div>
        </div>
        <div>
            <div class="label">🔮 Další</div>
            <canvas id="previewCanvas" width="120" height="120"></canvas>
        </div>
    </div>
</div>

<script>
    (function() {
        // ----- DOM elementy -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');

        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const linesDisplay = document.getElementById('linesDisplay');
        const statusMsg = document.getElementById('statusMsg');

        const restartBtn = document.getElementById('restartBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        // ----- Dotyková tlačítka -----
        const touchLeft = document.getElementById('touchLeft');
        const touchRight = document.getElementById('touchRight');
        const touchRotate = document.getElementById('touchRotate');
        const touchDrop = document.getElementById('touchDrop');

        // ----- Konfigurace -----
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        // ----- Definice tvarů -----
        const SHAPES = {
            I: { blocks: [[1,1,1,1]], color: '#3b82f6' },
            O: { blocks: [[1,1],[1,1]], color: '#facc15' },
            T: { blocks: [[0,1,0],[1,1,1]], color: '#a855f7' },
            S: { blocks: [[0,1,1],[1,1,0]], color: '#22c55e' },
            Z: { blocks: [[1,1,0],[0,1,1]], color: '#ef4444' },
            J: { blocks: [[1,0,0],[1,1,1]], color: '#3b82f6' },
            L: { blocks: [[0,0,1],[1,1,1]], color: '#f97316' }
        };

        const SHAPE_NAMES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

        // ----- Herní stav -----
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = false;
        let paused = false;
        let dropInterval = null;
        let animationFrame = null;

        // ----- Inicializace -----
        function initBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board.push(new Array(COLS).fill(0));
            }
        }

        function randomPiece() {
            const name = SHAPE_NAMES[Math.floor(Math.random() * SHAPE_NAMES.length)];
            const shape = SHAPES[name];
            return {
                name: name,
                blocks: shape.blocks.map(row => [...row]),
                color: shape.color,
                x: Math.floor((COLS - shape.blocks[0].length) / 2),
                y: 0
            };
        }

        function spawnPiece() {
            if (!nextPiece) {
                nextPiece = randomPiece();
            }
            currentPiece = {
                name: nextPiece.name,
                blocks: nextPiece.blocks.map(row => [...row]),
                color: nextPiece.color,
                x: Math.floor((COLS - nextPiece.blocks[0].length) / 2),
                y: 0
            };
            nextPiece = randomPiece();
            drawPreview();

            if (collides(currentPiece.blocks, currentPiece.x, currentPiece.y)) {
                gameOver = true;
                statusMsg.textContent = '💀 KONEC HRY! Klikni "Nová".';
                clearInterval(dropInterval);
                dropInterval = null;
                return false;
            }
            return true;
        }

        // ----- Kolize -----
        function collides(blocks, offsetX, offsetY) {
            for (let r = 0; r < blocks.length; r++) {
                for (let c = 0; c < blocks[0].length; c++) {
                    if (blocks[r][c] !== 0) {
                        const boardX = offsetX + c;
                        const boardY = offsetY + r;
                        if (boardX < 0 || boardX >= COLS || boardY >= ROWS || boardY < 0) {
                            return true;
                        }
                        if (boardY >= 0 && board[boardY][boardX] !== 0) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // ----- Rotace -----
        function rotateBlocks(blocks) {
            const rows = blocks.length;
            const cols = blocks[0].length;
            const rotated = [];
            for (let c = 0; c < cols; c++) {
                rotated.push([]);
                for (let r = rows - 1; r >= 0; r--) {
                    rotated[c].push(blocks[r][c]);
                }
            }
            return rotated;
        }

        // ----- Ukotvení -----
        function lockPiece() {
            if (!currentPiece) return;
            for (let r = 0; r < currentPiece.blocks.length; r++) {
                for (let c = 0; c < currentPiece.blocks[0].length; c++) {
                    if (currentPiece.blocks[r][c] !== 0) {
                        const boardX = currentPiece.x + c;
                        const boardY = currentPiece.y + r;
                        if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                }
            }
            clearLines();
            const success = spawnPiece();
            if (!success) {
                gameOver = true;
                statusMsg.textContent = '💀 KONEC HRY! Klikni "Nová".';
                clearInterval(dropInterval);
                dropInterval = null;
            }
            draw();
        }

        // ----- Smazání řádků -----
        function clearLines() {
            let cleared = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(new Array(COLS).fill(0));
                    cleared++;
                    r++;
                }
            }

            if (cleared > 0) {
                lines += cleared;
                const points = [0, 100, 300, 500, 800];
                const addScore = points[Math.min(cleared, 4)] * level;
                score += addScore;
                level = Math.floor(lines / 10) + 1;
                updateDisplay();
                updateDropSpeed();
                statusMsg.textContent = `🧹 +${cleared} řádky! +${addScore} bodů`;
                setTimeout(() => {
                    if (!gameOver && !paused) {
                        statusMsg.textContent = 'Pokračuj! 🎮';
                    }
                }, 1000);
            }
        }

        // ----- Rychlost pádu -----
        function updateDropSpeed() {
            if (dropInterval) {
                clearInterval(dropInterval);
                dropInterval = null;
            }
            if (gameOver || paused) return;
            const speed = Math.max(50, 600 - (level - 1) * 50);
            dropInterval = setInterval(() => {
                if (!paused && !gameOver && currentPiece) {
                    moveDown();
                }
            }, speed);
        }

        // ----- Pohyb -----
        function moveDown() {
            if (!currentPiece || gameOver || paused) return;
            if (!collides(currentPiece.blocks, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
                draw();
            } else {
                lockPiece();
                draw();
            }
        }

        function moveLeft() {
            if (!currentPiece || gameOver || paused) return;
            if (!collides(currentPiece.blocks, currentPiece.x - 1, currentPiece.y)) {
                currentPiece.x--;
                draw();
            }
        }

        function moveRight() {
            if (!currentPiece || gameOver || paused) return;
            if (!collides(currentPiece.blocks, currentPiece.x + 1, currentPiece.y)) {
                currentPiece.x++;
                draw();
            }
        }

        function rotatePiece() {
            if (!currentPiece || gameOver || paused) return;
            const rotated = rotateBlocks(currentPiece.blocks);
            if (!collides(rotated, currentPiece.x, currentPiece.y)) {
                currentPiece.blocks = rotated;
                draw();
            } else {
                if (!collides(rotated, currentPiece.x - 1, currentPiece.y)) {
                    currentPiece.blocks = rotated;
                    currentPiece.x--;
                    draw();
                } else if (!collides(rotated, currentPiece.x + 1, currentPiece.y)) {
                    currentPiece.blocks = rotated;
                    currentPiece.x++;
                    draw();
                }
            }
        }

        function hardDrop() {
            if (!currentPiece || gameOver || paused) return;
            while (!collides(currentPiece.blocks, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
            }
            lockPiece();
            draw();
        }

        // ----- Vykreslení -----
        function draw() {
            ctx.clearRect(0, 0, 300, 600);

            // Mřížka
            ctx.strokeStyle = 'rgba(60, 90, 120, 0.15)';
            ctx.lineWidth = 0.5;
            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * BLOCK_SIZE);
                ctx.lineTo(300, r * BLOCK_SIZE);
                ctx.stroke();
            }
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * BLOCK_SIZE, 0);
                ctx.lineTo(c * BLOCK_SIZE, 600);
                ctx.stroke();
            }

            // Board
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] !== 0) {
                        ctx.fillStyle = board[r][c];
                        ctx.shadowColor = board[r][c];
                        ctx.shadowBlur = 8;
                        ctx.fillRect(c * BLOCK_SIZE + 1, r * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(255,255,255,0.12)';
                        ctx.fillRect(c * BLOCK_SIZE + 2, r * BLOCK_SIZE + 2, BLOCK_SIZE - 8, 3);
                    }
                }
            }

            // Aktuální kus
            if (currentPiece && !gameOver) {
                const blocks = currentPiece.blocks;
                for (let r = 0; r < blocks.length; r++) {
                    for (let c = 0; c < blocks[0].length; c++) {
                        if (blocks[r][c] !== 0) {
                            const x = (currentPiece.x + c) * BLOCK_SIZE;
                            const y = (currentPiece.y + r) * BLOCK_SIZE;
                            ctx.fillStyle = currentPiece.color;
                            ctx.shadowColor = currentPiece.color;
                            ctx.shadowBlur = 12;
                            ctx.fillRect(x + 1, y + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = 'rgba(255,255,255,0.2)';
                            ctx.fillRect(x + 2, y + 2, BLOCK_SIZE - 8, 3);
                        }
                    }
                }
            }

            // Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, 300, 600);
                ctx.fillStyle = '#fca5a5';
                ctx.font = 'bold 36px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', 150, 270);
                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText('Klikni "Nová"', 150, 330);
            }

            // Pauza
            if (paused && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, 300, 600);
                ctx.fillStyle = '#fde047';
                ctx.font = 'bold 40px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸', 150, 280);
                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText('PAUZA', 150, 340);
            }
        }

        function drawPreview() {
            previewCtx.clearRect(0, 0, 120, 120);
            if (!nextPiece) return;
            const blocks = nextPiece.blocks;
            const blockSize = 25;
            const cols = blocks[0].length;
            const rows = blocks.length;
            const offsetX = (120 - cols * blockSize) / 2;
            const offsetY = (120 - rows * blockSize) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (blocks[r][c] !== 0) {
                        const x = offsetX + c * blockSize;
                        const y = offsetY + r * blockSize;
                        previewCtx.fillStyle = nextPiece.color;
                        previewCtx.shadowColor = nextPiece.color;
                        previewCtx.shadowBlur = 10;
                        previewCtx.fillRect(x + 1, y + 1, blockSize - 2, blockSize - 2);
                        previewCtx.shadowBlur = 0;
                        previewCtx.fillStyle = 'rgba(255,255,255,0.15)';
                        previewCtx.fillRect(x + 2, y + 2, blockSize - 8, 3);
                    }
                }
            }
        }

        function updateDisplay() {
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            linesDisplay.textContent = lines;
        }

        // ----- Pauza -----
        function togglePause() {
            if (gameOver) return;
            paused = !paused;
            pauseBtn.textContent = paused ? '▶ Pokračovat' : '⏸ Pauza';
            statusMsg.textContent = paused ? '⏸ PAUZA - klikni "Pokračovat"' : '▶ Hra pokračuje';
            if (paused) {
                if (dropInterval) {
                    clearInterval(dropInterval);
                    dropInterval = null;
                }
            } else {
                updateDropSpeed();
            }
            draw();
        }

        // ----- Nová hra -----
        function startNewGame() {
            if (dropInterval) {
                clearInterval(dropInterval);
                dropInterval = null;
            }
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            initBoard();
            score = 0;
            level = 1;
            lines = 0;
            gameOver = false;
            paused = false;
            pauseBtn.textContent = '⏸ Pauza';
            updateDisplay();
            statusMsg.textContent = '🎮 Nová hra!';

            nextPiece = randomPiece();
            spawnPiece();
            drawPreview();
            draw();
            updateDropSpeed();
        }

        // ----- Herní smyčka -----
        function gameLoop() {
            draw();
            animationFrame = requestAnimationFrame(gameLoop);
        }

        // ----- Ovládání kláves -----
        function handleKeyDown(e) {
            const key = e.key;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'p', 'P'].includes(key)) {
                e.preventDefault();
            }

            if (key === 'p' || key === 'P') {
                togglePause();
                return;
            }

            if (gameOver || paused) return;

            switch (key) {
                case 'ArrowLeft': moveLeft(); break;
                case 'ArrowRight': moveRight(); break;
                case 'ArrowDown': moveDown(); break;
                case 'ArrowUp': rotatePiece(); break;
                case ' ': hardDrop(); break;
            }
        }

        // ----- Inicializace -----
        function init() {
            window.addEventListener('keydown', handleKeyDown);

            restartBtn.addEventListener('click', startNewGame);
            pauseBtn.addEventListener('click', togglePause);

            // Dotyková tlačítka
            touchLeft.addEventListener('click', moveLeft);
            touchRight.addEventListener('click', moveRight);
            touchRotate.addEventListener('click', rotatePiece);
            touchDrop.addEventListener('click', hardDrop);

            // Zabránění scrollování při dotyku
            document.querySelectorAll('.touch-btn').forEach(btn => {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                });
            });

            startNewGame();
            gameLoop();

            window.addEventListener('blur', () => {
                // Při ztrátě focusu nic neděláme
            });
        }

        // ----- roundRect polyfill -----
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        init();
    })();
</script>
</body>
