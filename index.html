<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volby - Vesnice</title>
  <style>
    :root{--bg:#f7fafc;--card:#ffffff;--accent:#0ea5e9;--dark:#0f172a;--muted:#6b7280}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0;background:var(--bg);color:var(--dark)}

    /* Sticky nav */
    nav{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,#0ea5e9, #6366f1);color:white;padding:10px 20px;display:flex;align-items:center;gap:18px}
    .brand{font-weight:700;font-size:18px}
    .nav-links{display:flex;gap:10px;overflow:auto}
    .nav-links a{color:rgba(255,255,255,0.95);text-decoration:none;padding:8px 12px;border-radius:8px}
    .nav-links a.active{background:rgba(255,255,255,0.12)}

    /* Hero */
    .hero{background:linear-gradient(180deg, rgba(99,102,241,0.08), transparent);padding:60px 20px 36px;text-align:center}
    .hero h1{font-size:48px;margin:0;color:var(--dark);letter-spacing:-1px}
    .hero p{margin:10px 0 0;color:var(--muted);font-size:16px}

    main{max-width:1000px;margin:28px auto;padding:0 20px}
    .candidate{background:var(--card);padding:20px;border-radius:12px;box-shadow:0 8px 24px rgba(2,6,23,0.06);margin-bottom:18px}
    .candidate h2{margin:0 0 6px}
    .meta{color:var(--muted);font-size:14px;margin-bottom:10px}
    .platform ul{margin:6px 0 0 18px}

    footer{max-width:1000px;margin:36px auto 60px;padding:18px 20px;background:transparent;color:var(--muted);font-size:14px;text-align:center}

    @media (max-width:640px){.hero h1{font-size:34px;padding:0 8px}}
  </style>
</head>
<body>
  <nav aria-label="Hlavní navigace">
    <div class="brand">Vesnice • Volby 2026</div>
    <div class="nav-links" id="navLinks" role="navigation" aria-label="Seznam kandidátů">
      <!-- Odkazy budou doplněny JS -->
    </div>
  </nav>

  <header class="hero">
    <h1>Volby do zastupitelstva — Vesnice</h1>
    <p>Vyberte svého zástupce. Přečtěte si programy kandidátů a zapojte se do dění v obci.</p>
  </header>

  <main id="content">
    <!-- Kandidáti budou vykresleni sem -->
  </main>

  <footer>
    <div>Vesnice • Volby 2026 — Informace slouží k demonstraci. &nbsp; Občanská iniciativa Vesnice.</div>
    <div style="margin-top:8px;color:#9ca3af;font-size:13px">Kontakt: volby@vesnice.example • Telefon: +420 123 456 789</div>
  </footer>

  <script>
    // Kandidáti (náhodná jména a programy)
    const candidates = [
      {id:'c1', name:'Jan Novotný', age:49, platform:[
        'Oprava místních komunikací a lepší veřejné osvětlení',
        'Podpora místních živnostníků',
        'Komunitní zahrada u náměstí'
      ]},
      {id:'c2', name:'Petr Svoboda', age:36, platform:[
        'Bezpečné chodníky a úprava přechodů',
        'Dotace na opravy střech pro seniory',
        'Podpora místních školních projektů'
      ]},
      {id:'c3', name:'Lucie Dvořáková', age:42, platform:[
        'Zvýšení transparentnosti rozpočtu',
        'Wi‑Fi hotspoty na veřejných místech',
        'Program pro mladé rodiny (slevy, kurzy)'
      ]},
      {id:'c4', name:'Martina Kovářová', age:31, platform:[
        'Založení komunitního centra a knihovny',
        'Ekologické třídění odpadu a osvěta',
        'Cyklostezky mezi osadami'
      ]},
      {id:'c5', name:'Tomáš Marek', age:55, platform:[
        'Podpora místního podnikání a trhů',
        'Oprava potoka a zabránění erozím',
        'Veteránské a kulturní akce pro obyvatele'
      ]},
      {id:'c6', name:'Eva Horáková', age:28, platform:[
        'Levné sportovní aktivity pro mládež',
        'Modernizace školní zahrady',
        'Program zdraví pro seniory (domácí návštěvy)'
      ]},
      {id:'c7', name:'Milan Procházka', age:63, platform:[
        'Údržba veřejných prostranství a laviček',
        'Rozšíření sběrného dvoru',
        'Péče o historii vesnice a památky'
      ]},
      {id:'c8', name:'Alena Černá', age:39, platform:[
        'Zlepšení dodávek pitné vody a kontrola kvality',
        'Podpora místních spolků a dobrovolnictví',
        'Zřízení noční linky pro seniory'
      ]},
      {id:'c9', name:'Josef Kučera', age:46, platform:[
        'Energetické úspory veřejných budov',
        'Zřízení komunitní dílny pro kutily',
        'Program pro zaměstnanost v regionu'
      ]}
    ];

    const navLinks = document.getElementById('navLinks');
    const content = document.getElementById('content');

    // Render nav links
    function renderNav(){
      // Home link
      const home = document.createElement('a');
      home.href = '#top';
      home.textContent = 'Domů';
      home.addEventListener('click', (e)=>{e.preventDefault(); window.scrollTo({top:0, behavior:'smooth'});});
      navLinks.appendChild(home);

      // Candidate links
      candidates.forEach(c => {
        const a = document.createElement('a');
        a.href = '#'+c.id;
        a.textContent = c.name.split(' ')[0]; // krátký label
        navLinks.appendChild(a);
      });

      // Contact
      const contact = document.createElement('a');
      contact.href = '#kontakt';
      contact.textContent = 'Kontakt';
      navLinks.appendChild(contact);
    }

    // Render candidate sections
    function renderCandidates(){
      candidates.forEach(c => {
        const sec = document.createElement('section');
        sec.className = 'candidate';
        sec.id = c.id;

        const h = document.createElement('h2');
        h.textContent = c.name;
        sec.appendChild(h);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `Věk: ${c.age} let`;
        sec.appendChild(meta);

        const plat = document.createElement('div');
        plat.className = 'platform';
        const ul = document.createElement('ul');
        c.platform.forEach(p => { const li = document.createElement('li'); li.textContent = p; ul.appendChild(li); });
        plat.appendChild(ul);
        sec.appendChild(plat);

        content.appendChild(sec);
      });

      // Kontakt sekce (kotva)
      const kontakt = document.createElement('section');
      kontakt.id = 'kontakt';
      kontakt.className = 'candidate';
      kontakt.innerHTML = '<h2>Kontakt</h2><div class="meta">Máte otázky? Napište nám nebo zavolejte.</div><p style="margin-top:8px">E‑mail: <strong>volby@vesnice.example</strong><br>Telefon: +420 123 456 789</p>';
      content.appendChild(kontakt);
    }

    // Highlight active nav link while scrolling
    function setupObserver(){
      const links = Array.from(navLinks.querySelectorAll('a'));
      const sections = candidates.map(c => document.getElementById(c.id));
      sections.push(document.getElementById('kontakt'));

      const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const id = entry.target.id;
          const link = navLinks.querySelector(`a[href="#${id}"]`);
          if(entry.isIntersecting){
            links.forEach(l => l.classList.remove('active'));
            if(link) link.classList.add('active');
          }
        });
      },{root:null,rootMargin:'-40% 0px -40% 0px',threshold:0});

      sections.forEach(s => { if(s) obs.observe(s); });
    }

    // Initialize
    renderNav();
    renderCandidates();
    setupObserver();

    // Ensure top anchor exists for 'Domů'
    if(!document.getElementById('top')){
      const top = document.createElement('div'); top.id='top'; top.style.height='0'; document.body.prepend(top);
    }
  </script>
</body>
</html>
