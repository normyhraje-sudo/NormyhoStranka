<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volby - Vesnice</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--accent:#2563eb;--muted:#6b7280}
    *{box-sizing:border-box}
    body{font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0;background:var(--bg);color:#111}
    header{background:linear-gradient(90deg, #0ea5e9 0%, #6366f1 100%);color:white;padding:36px 20px;text-align:center}
    header h1{margin:0;font-size:28px;letter-spacing:0.2px}
    header p{margin:6px 0 0;color:rgba(255,255,255,0.9)}

    main{max-width:1100px;margin:28px auto;padding:0 20px}
    .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
    .search{flex:1;min-width:220px}
    input[type="search"]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e6e9ef;background:white}
    .actions{display:flex;gap:8px}
    button.btn{background:var(--accent);color:white;padding:10px 14px;border:none;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;border:1px solid #d1d5db;color:var(--muted)}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
    .card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 6px 20px rgba(2,6,23,0.06);display:flex;flex-direction:column}
    .card h3{margin:0 0 6px;font-size:18px}
    .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
    .platform{flex:1;margin-bottom:12px}
    .platform ul{margin:6px 0 0 18px;padding:0;color:#111}
    .vote-row{display:flex;align-items:center;gap:10px}
    .count{font-weight:700;background:#f1f5f9;padding:6px 10px;border-radius:8px}

    footer{max-width:1100px;margin:28px auto 60px;padding:18px 20px;background:transparent;color:var(--muted);font-size:14px;text-align:center}
    .brand{font-weight:600;color:var(--accent)}

    @media (max-width:480px){header h1{font-size:20px}}
  </style>
</head>
<body>
  <header>
    <h1>Volby do zastupitelstva - Vesnice</h1>
    <p>Seznam kandidátů a jejich programy. Podpoř svého favorita lokálně!</p>
  </header>

  <main>
    <section class="controls">
      <div class="search">
        <label for="q" class="sr-only">Hledat kandidáta</label>
        <input id="q" type="search" placeholder="Hledej kandidáta (jméno nebo cíl)..." />
      </div>
      <div class="actions">
        <button id="resetVotes" class="btn ghost">Resetovat hlasy (lokálně)</button>
        <button id="randomize" class="btn">Náhodné hlasy (demo)</button>
      </div>
    </section>

    <section class="grid" id="candidates">
      <!-- Kandidáti budou vykresleni JS -->
    </section>
  </main>

  <footer>
    <div>Vesnice • Volby 2026 — Informace slouží k demonstraci. &nbsp; <span class="brand">Občanská iniciativa Vesnice</span>.</div>
    <div style="margin-top:8px;color:#9ca3af;font-size:13px">Kontakt: volby@vesnice.example • Telefon: +420 123 456 789</div>
  </footer>

  <script>
    // Kandidáti (náhodná jména a programy)
    const candidates = [
      {id:'c1', name:'Jan Novotný', age:49, platform:[
        'Oprava místních komunikací a lepší veřejné osvětlení',
        'Podpora místních živnostníků',
        'Komunitní zahrada u náměstí'
      ]},
      {id:'c2', name:'Petr Svoboda', age:36, platform:[
        'Bezpečné chodníky a úprava přechodů',
        'Dotace na opravy střech pro seniory',
        'Podpora místních školních projektů'
      ]},
      {id:'c3', name:'Lucie Dvořáková', age:42, platform:[
        'Zvýšení transparentnosti rozpočtu',
        'Wi‑Fi hotspoty na veřejných místech',
        'Program pro mladé rodiny (slevy, kurzy)'
      ]},
      {id:'c4', name:'Martina Kovářová', age:31, platform:[
        'Založení komunitního centra a knihovny',
        'Ekologické třídění odpadu a osvěta',
        'Cyklostezky mezi osadami'
      ]},
      {id:'c5', name:'Tomáš Marek', age:55, platform:[
        'Podpora místního podnikání a trhů',
        'Oprava potoka a zabránění erozím',
        'Veteránské a kulturní akce pro obyvatele'
      ]},
      {id:'c6', name:'Eva Horáková', age:28, platform:[
        'Levné sportovní aktivity pro mládež',
        'Modernizace školní zahrady',
        'Program zdraví pro seniory (domácí návštěvy)'
      ]},
      {id:'c7', name:'Milan Procházka', age:63, platform:[
        'Údržba veřejných prostranství a laviček',
        'Rozšíření sběrného dvoru',
        'Péče o historii vesnice a památky'
      ]},
      {id:'c8', name:'Alena Černá', age:39, platform:[
        'Zlepšení dodávek pitné vody a kontrola kvality',
        'Podpora místních spolků a dobrovolnictví',
        'Zřízení noční linky pro seniory'
      ]},
      {id:'c9', name:'Josef Kučera', age:46, platform:[
        'Energetické úspory veřejných budov',
        'Zřízení komunitní dílny pro kutily',
        'Program pro zaměstnanost v regionu'
      ]}
    ];

    const candidatesEl = document.getElementById('candidates');
    const qInput = document.getElementById('q');

    // Load votes from localStorage or init
    function loadVotes(){
      const votes = JSON.parse(localStorage.getItem('votes') || '{}');
      return votes;
    }
    function saveVotes(votes){ localStorage.setItem('votes', JSON.stringify(votes)); }

    function render(){
      const q = qInput.value.trim().toLowerCase();
      const votes = loadVotes();
      candidatesEl.innerHTML = '';
      candidates.forEach(c => {
        const hay = (c.name + ' ' + c.platform.join(' ')).toLowerCase();
        if(q && !hay.includes(q)) return;

        const card = document.createElement('article');
        card.className = 'card';

        const h = document.createElement('h3');
        h.textContent = c.name;
        card.appendChild(h);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `Věk: ${c.age} let`;
        card.appendChild(meta);

        const plat = document.createElement('div');
        plat.className = 'platform';
        const ul = document.createElement('ul');
        c.platform.forEach(p => { const li = document.createElement('li'); li.textContent = p; ul.appendChild(li); });
        plat.appendChild(ul);
        card.appendChild(plat);

        const voteRow = document.createElement('div');
        voteRow.className = 'vote-row';

        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = 'Podpořím';
        btn.addEventListener('click', () => {
          votes[c.id] = (votes[c.id]||0) + 1;
          saveVotes(votes);
          updateCounts();
          // jednoduchá animace
          btn.animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:180});
        });

        const count = document.createElement('div');
        count.className = 'count';
        count.id = 'count-'+c.id;
        count.textContent = votes[c.id]||0;

        voteRow.appendChild(btn);
        voteRow.appendChild(count);
        card.appendChild(voteRow);

        candidatesEl.appendChild(card);
      });
    }

    function updateCounts(){
      const votes = loadVotes();
      candidates.forEach(c => {
        const el = document.getElementById('count-'+c.id);
        if(el) el.textContent = votes[c.id]||0;
      });
    }

    // Reset votes locally (for demo)
    document.getElementById('resetVotes').addEventListener('click', () => {
      if(!confirm('Opravdu chceš resetovat hlasy v tomto prohlížeči?')) return;
      localStorage.removeItem('votes');
      render();
    });

    // Randomize demo votes
    document.getElementById('randomize').addEventListener('click', () => {
      const votes = {};
      candidates.forEach(c => votes[c.id] = Math.floor(Math.random()*120));
      saveVotes(votes);
      updateCounts();
      render();
    });

    // Search input
    qInput.addEventListener('input', () => render());

    // Initial render
    render();
  </script>
</body>
</html>
