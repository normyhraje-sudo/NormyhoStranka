<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 0.5rem;
            overflow: hidden;
        }

        .game-wrapper {
            background: #1e2a3a;
            padding: 1.2rem 1.5rem 1.5rem;
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 420px;
            width: 100%;
        }

        h1 {
            color: #f0e9d8;
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-shadow: 0 3px 0 #0b0f1a;
            margin-bottom: 0.3rem;
        }
        h1 span {
            color: #facc15;
        }

        .stats {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cbd5e1;
            font-size: 1rem;
            padding: 0.2rem 0.3rem 0.5rem;
            border-bottom: 1px solid #3a4a5e;
            margin-bottom: 0.8rem;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .stats > div {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: #0f1a2a;
            padding: 0.1rem 0.8rem 0.1rem 0.5rem;
            border-radius: 40px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .stats .icon {
            font-size: 1.2rem;
            line-height: 1;
        }
        .stats .value {
            font-weight: 700;
            font-size: 1.3rem;
            color: #facc15;
            min-width: 2rem;
            text-align: center;
        }

        .board-container {
            background: #0f1a2a;
            border-radius: 1.5rem;
            padding: 0.8rem;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6), 0 0 0 2px #2a3a4e;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 400px;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            image-rendering: pixelated;
            touch-action: none;
        }

        .controls {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        button {
            background: #facc15;
            border: none;
            color: #0b0f1a;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.35rem 1.2rem;
            border-radius: 60px;
            box-shadow: 0 6px 0 #a07c0e, 0 6px 18px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.07s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #a07c0e;
        }

        .back-button {
            background: #64748b;
            box-shadow: 0 6px 0 #475569, 0 6px 18px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            color: #0b0f1a;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.35rem 1rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.07s ease;
            border: none;
        }
        .back-button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #475569;
        }
        .back-button:hover {
            background: #94a3b8;
        }

        .status {
            color: #94a3b8;
            font-size: 0.8rem;
            min-height: 1.5rem;
            font-weight: 300;
            text-align: center;
            margin-top: 0.3rem;
            width: 100%;
        }

        .hint {
            color: #64748b;
            font-size: 0.65rem;
            text-align: center;
            margin-top: 0.1rem;
        }

        .hint kbd {
            background: #0b1622;
            padding: 0.05rem 0.5rem;
            border-radius: 6px;
            color: #cbd5e1;
            border: 1px solid #334155;
            font-size: 0.6rem;
        }

        @media (hover: none) and (pointer: coarse) {
            .hint {
                display: none;
            }
        }

        @media (max-width: 450px) {
            .game-wrapper {
                padding: 1rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            .stats {
                font-size: 0.85rem;
            }
            .stats .value {
                font-size: 1.1rem;
                min-width: 1.5rem;
            }
            button {
                font-size: 0.75rem;
                padding: 0.25rem 0.9rem;
            }
            .back-button {
                font-size: 0.7rem;
                padding: 0.25rem 0.8rem;
            }
            .board-container {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <h1>🔢 <span>2048</span></h1>

    <div class="stats">
        <div><span class="icon">⭐</span><span class="value" id="scoreDisplay">0</span></div>
        <div><span class="icon">🏆</span><span class="value" id="bestDisplay">0</span></div>
    </div>

    <div class="board-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <button id="restartBtn">🔄 Nová</button>
        <a href="hra.html" class="back-button">⬅ Zpět</a>
    </div>
    <div class="status" id="statusMsg">Použij šipky ← → ↑ ↓ nebo přetahuj</div>
    <div class="hint">
        <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> pohyb &nbsp;·&nbsp; <kbd>R</kbd> restart
    </div>
</div>

<script>
    (function() {
        "use strict";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestDisplay = document.getElementById('bestDisplay');
        const statusMsg = document.getElementById('statusMsg');
        const restartBtn = document.getElementById('restartBtn');

        const SIZE = 4;
        const CELL_SIZE = 400 / SIZE;
        const PADDING = 8;

        let board = [];
        let score = 0;
        let bestScore = 0;
        let gameOver = false;
        let won = false;
        let frameId = null;

        // ----- Barvy dlaždic -----
        const COLORS = {
            0: '#1a2a3a',
            2: '#e2e8f0',
            4: '#fde047',
            8: '#f97316',
            16: '#ef4444',
            32: '#ec4899',
            64: '#a855f7',
            128: '#3b82f6',
            256: '#22c55e',
            512: '#14b8a6',
            1024: '#facc15',
            2048: '#f43f5e'
        };

        const TEXT_COLORS = {
            0: 'transparent',
            2: '#0f172a',
            4: '#0f172a',
            8: '#ffffff',
            16: '#ffffff',
            32: '#ffffff',
            64: '#ffffff',
            128: '#ffffff',
            256: '#ffffff',
            512: '#ffffff',
            1024: '#ffffff',
            2048: '#ffffff'
        };

        // ----- Načtení rekordu -----
        try {
            bestScore = parseInt(localStorage.getItem('game2048best')) || 0;
        } catch (e) {
            bestScore = 0;
        }
        bestDisplay.textContent = bestScore;

        // ----- Inicializace -----
        function initBoard() {
            board = [];
            for (let r = 0; r < SIZE; r++) {
                board.push(new Array(SIZE).fill(0));
            }
            addRandomTile();
            addRandomTile();
            score = 0;
            gameOver = false;
            won = false;
            scoreDisplay.textContent = '0';
            statusMsg.textContent = 'Spoj čísla a dostaň se na 2048!';
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) empty.push({ r, c });
                }
            }
            if (empty.length === 0) return;
            const pos = empty[Math.floor(Math.random() * empty.length)];
            board[pos.r][pos.c] = Math.random() < 0.9 ? 2 : 4;
        }

        // ----- Pohyb -----
        function move(direction) {
            if (gameOver || won) return;

            let moved = false;
            let newBoard = board.map(row => [...row]);
            let newScore = score;

            if (direction === 'left') {
                for (let r = 0; r < SIZE; r++) {
                    const result = slideRow(newBoard[r]);
                    newBoard[r] = result.row;
                    newScore += result.score;
                    if (result.moved) moved = true;
                }
            } else if (direction === 'right') {
                for (let r = 0; r < SIZE; r++) {
                    const reversed = [...newBoard[r]].reverse();
                    const result = slideRow(reversed);
                    newBoard[r] = result.row.reverse();
                    newScore += result.score;
                    if (result.moved) moved = true;
                }
            } else if (direction === 'up') {
                for (let c = 0; c < SIZE; c++) {
                    const col = [];
                    for (let r = 0; r < SIZE; r++) col.push(newBoard[r][c]);
                    const result = slideRow(col);
                    for (let r = 0; r < SIZE; r++) newBoard[r][c] = result.row[r];
                    newScore += result.score;
                    if (result.moved) moved = true;
                }
            } else if (direction === 'down') {
                for (let c = 0; c < SIZE; c++) {
                    const col = [];
                    for (let r = SIZE - 1; r >= 0; r--) col.push(newBoard[r][c]);
                    const result = slideRow(col);
                    for (let r = SIZE - 1; r >= 0; r--) newBoard[r][c] = result.row[SIZE - 1 - r];
                    newScore += result.score;
                    if (result.moved) moved = true;
                }
            }

            if (moved) {
                board = newBoard;
                score = newScore;
                scoreDisplay.textContent = score;
                if (score > bestScore) {
                    bestScore = score;
                    try {
                        localStorage.setItem('game2048best', bestScore);
                    } catch (e) {}
                    bestDisplay.textContent = bestScore;
                }
                addRandomTile();
                draw();

                // Kontrola výhry
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        if (board[r][c] === 2048) {
                            won = true;
                            statusMsg.textContent = '🎉 VYHRÁL JSI! 2048!';
                            return;
                        }
                    }
                }

                // Kontrola prohry
                if (isGameOver()) {
                    gameOver = true;
                    statusMsg.textContent = '💀 KONEC! Klikni "Nová".';
                }
            }
        }

        function slideRow(row) {
            // Odstranění nul
            let filtered = row.filter(v => v !== 0);
            let newRow = [];
            let scoreGain = 0;
            let moved = false;

            for (let i = 0; i < filtered.length; i++) {
                if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
                    newRow.push(filtered[i] * 2);
                    scoreGain += filtered[i] * 2;
                    i++;
                    moved = true;
                } else {
                    newRow.push(filtered[i]);
                }
            }

            while (newRow.length < SIZE) newRow.push(0);

            // Kontrola, zda se něco změnilo
            for (let i = 0; i < SIZE; i++) {
                if (row[i] !== newRow[i]) moved = true;
            }

            return { row: newRow, score: scoreGain, moved: moved };
        }

        function isGameOver() {
            // Kontrola prázdných buněk
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) return false;
                }
            }
            // Kontrola možných spojení
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return false;
                    if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return false;
                }
            }
            return true;
        }

        // ----- Vykreslení -----
        function draw() {
            ctx.clearRect(0, 0, 400, 400);

            // Pozadí
            ctx.fillStyle = '#0f1a2a';
            ctx.fillRect(0, 0, 400, 400);

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const x = c * CELL_SIZE + PADDING;
                    const y = r * CELL_SIZE + PADDING;
                    const w = CELL_SIZE - PADDING * 2;
                    const value = board[r][c];

                    // Dlaždice
                    ctx.fillStyle = COLORS[value] || '#1a2a3a';
                    ctx.shadowColor = 'rgba(0,0,0,0.2)';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.roundRect(x, y, w, w, 8);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Číslo
                    if (value !== 0) {
                        ctx.fillStyle = TEXT_COLORS[value] || '#ffffff';
                        ctx.font = `bold ${value >= 1024 ? 28 : value >= 128 ? 32 : 38}px "Segoe UI", sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(value, x + w / 2, y + w / 2 + 2);
                    }
                }
            }

            // Game Over overlay
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = '#fca5a5';
                ctx.font = 'bold 44px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 12;
                ctx.fillText('GAME OVER', 200, 180);
                ctx.font = '22px sans-serif';
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText('Skóre: ' + score, 200, 240);
                ctx.shadowBlur = 0;
            }

            if (won) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = '#fde047';
                ctx.font = 'bold 44px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 12;
                ctx.fillText('🎉 2048!', 200, 180);
                ctx.font = '22px sans-serif';
                ctx.fillStyle = '#f1f5f9';
                ctx.fillText('Můžeš pokračovat!', 200, 240);
                ctx.shadowBlur = 0;
            }
        }

        // ----- Herní smyčka -----
        function gameLoop() {
            draw();
            frameId = requestAnimationFrame(gameLoop);
        }

        // ----- Reset -----
        function resetGame() {
            if (frameId) {
                cancelAnimationFrame(frameId);
                frameId = null;
            }
            initBoard();
            draw();
            gameLoop();
        }

        // ----- Ovládání -----
        function handleKeyDown(e) {
            const key = e.key;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                e.preventDefault();
                const map = {
                    'ArrowLeft': 'left',
                    'ArrowRight': 'right',
                    'ArrowUp': 'up',
                    'ArrowDown': 'down'
                };
                move(map[key]);
            }
            if (key === 'r' || key === 'R') {
                e.preventDefault();
                resetGame();
            }
        }

        // ----- Dotykové ovládání (přetahování) -----
        let touchStartX = 0,
            touchStartY = 0;
        let touchActive = false;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            touchStartX = (touch.clientX - rect.left) * scaleX;
            touchStartY = (touch.clientY - rect.top) * scaleY;
            touchActive = true;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!touchActive) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const currentX = (touch.clientX - rect.left) * scaleX;
            const currentY = (touch.clientY - rect.top) * scaleY;

            const dx = currentX - touchStartX;
            const dy = currentY - touchStartY;

            if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
                touchStartX = currentX;
                touchStartY = currentY;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchActive = false;
        }, { passive: false });

        // ----- Inicializace -----
        function initGame() {
            window.addEventListener('keydown', handleKeyDown);

            restartBtn.addEventListener('click', resetGame);

            // Polyfill pro roundRect
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    return this;
                };
            }

            initBoard();
            draw();
            gameLoop();
        }

        initGame();
    })();
</script>
</body>
</html>
