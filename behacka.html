<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Běhačka - s joystickem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            touch-action: none;
            padding: 0.5rem;
        }

        .game-container {
            background: #1e2a3a;
            padding: 1.5rem;
            border-radius: 3rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 750px;
            width: 100%;
        }

        h1 {
            color: #f0e9d8;
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: 3px;
            text-shadow: 0 3px 0 #0b0f1a;
            margin-bottom: 0.3rem;
        }
        h1 span {
            color: #facc15;
        }

        .stats {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cbd5e1;
            font-size: 1.1rem;
            padding: 0.2rem 0.3rem 0.6rem;
            border-bottom: 1px solid #3a4a5e;
            margin-bottom: 1rem;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .stats > div {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: #0f1a2a;
            padding: 0.15rem 1rem 0.15rem 0.6rem;
            border-radius: 40px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .stats .icon {
            font-size: 1.4rem;
            line-height: 1;
        }
        .stats .value {
            font-weight: 700;
            font-size: 1.5rem;
            color: #facc15;
            min-width: 2rem;
            text-align: center;
        }
        .stats .value.lives {
            color: #ef4444;
        }

        canvas {
            display: block;
            background: #0b1622;
            border-radius: 1.8rem;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 0 2px #334155;
            width: 100%;
            height: auto;
            aspect-ratio: 700 / 400;
            touch-action: none;
            cursor: none;
        }

        /* ----- OVLÁDACÍ LIŠTA (joystick + tlačítka) ----- */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        /* Joystick - SKRYTÝ na PC, VIDITELNÝ jen na dotykových zařízeních */
        .joystick-wrapper {
            display: none; /* Skrytý na PC */
            align-items: center;
            gap: 0.5rem;
        }

        /* Zobrazit joystick POUZE na dotykových zařízeních (mobil/tablet) */
        @media (hover: none) and (pointer: coarse) {
            .joystick-wrapper {
                display: flex;
            }
        }

        .joystick-label {
            color: #94a3b8;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        .joystick-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.08), rgba(0,0,0,0.5));
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 20px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.3);
            touch-action: none;
            position: relative;
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .joystick-container.active {
            transform: scale(1.05);
            border-color: rgba(250, 204, 21, 0.3);
        }

        .joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #facc15, #eab308);
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.3), inset 0 -4px 8px rgba(0,0,0,0.3);
            transition: box-shadow 0.2s ease;
            pointer-events: none;
            touch-action: none;
        }

        .joystick-knob.active {
            box-shadow: 0 4px 30px rgba(250, 204, 21, 0.6), inset 0 -4px 8px rgba(0,0,0,0.3);
        }

        /* Menší joystick na malých obrazovkách */
        @media (max-width: 500px) {
            .joystick-container {
                width: 60px;
                height: 60px;
            }
            .joystick-knob {
                width: 28px;
                height: 28px;
            }
            .joystick-label {
                font-size: 0.6rem;
            }
        }

        @media (max-width: 380px) {
            .joystick-container {
                width: 50px;
                height: 50px;
            }
            .joystick-knob {
                width: 22px;
                height: 22px;
            }
        }

        /* Tlačítka */
        .buttons-group {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #facc15;
            border: none;
            color: #0b0f1a;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.4rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 7px 0 #a07c0e, 0 6px 18px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.07s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            touch-action: manipulation;
            white-space: nowrap;
        }
        button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #a07c0e;
        }
        button:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #7a5f0b;
            pointer-events: none;
        }

        .back-button {
            background: #64748b;
            box-shadow: 0 7px 0 #475569, 0 6px 18px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            color: #0b0f1a;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.07s ease;
            touch-action: manipulation;
            border: none;
            white-space: nowrap;
        }
        .back-button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #475569;
        }
        .back-button:hover {
            background: #94a3b8;
        }

        .status {
            color: #94a3b8;
            font-size: 0.9rem;
            min-height: 2rem;
            font-weight: 300;
            letter-spacing: 0.3px;
            text-align: center;
            width: 100%;
            margin-top: 0.3rem;
        }

        .controls-hint {
            color: #64748b;
            font-size: 0.75rem;
            margin-top: 0.1rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 1rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .stats {
                font-size: 0.9rem;
                padding: 0.1rem 0 0.4rem;
            }
            .stats .value {
                font-size: 1.2rem;
                min-width: 1.5rem;
            }
            .stats .icon {
                font-size: 1.2rem;
            }
            .controls-row {
                gap: 0.8rem;
            }
            button {
                font-size: 0.85rem;
                padding: 0.35rem 1rem;
            }
            .back-button {
                font-size: 0.8rem;
                padding: 0.35rem 1rem;
            }
            .status {
                font-size: 0.8rem;
                min-height: 1.5rem;
            }
        }

        @media (max-width: 400px) {
            .game-container {
                padding: 0.7rem;
                border-radius: 1.5rem;
            }
            h1 {
                font-size: 1.2rem;
            }
            .stats > div {
                padding: 0.1rem 0.7rem 0.1rem 0.4rem;
            }
            .stats .value {
                font-size: 1rem;
                min-width: 1.2rem;
            }
            .controls-row {
                gap: 0.5rem;
            }
            button {
                font-size: 0.75rem;
                padding: 0.25rem 0.8rem;
            }
            .back-button {
                font-size: 0.7rem;
                padding: 0.25rem 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🏃 <span>BĚHAČKA</span></h1>

    <div class="stats">
        <div><span class="icon">🪙</span><span class="value" id="coinDisplay">0</span></div>
        <div><span class="icon">❤️</span><span class="value lives" id="livesDisplay">3</span></div>
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <!-- OVLÁDACÍ LIŠTA -->
    <div class="controls-row">
        <!-- JOYSTICK (viditelný POUZE na mobilu) -->
        <div class="joystick-wrapper">
            <span class="joystick-label">🕹️</span>
            <div class="joystick-container" id="joystickContainer">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
        </div>

        <!-- TLAČÍTKA -->
        <div class="buttons-group">
            <button id="restartBtn">🔄 Nová hra</button>
            <a href="hra.html" class="back-button">⬅ Zpět</a>
        </div>
    </div>

    <span class="status" id="statusMsg">Použij šipky ← → ↑ ↓ nebo WASD</span>
    <div class="controls-hint">🕹️ Na mobilu použij joystick vlevo</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const coinDisplay = document.getElementById('coinDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const statusMsg = document.getElementById('statusMsg');

        // Joystick elementy
        const joystickContainer = document.getElementById('joystickContainer');
        const joystickKnob = document.getElementById('joystickKnob');

        // ----- Herní konstanty -----
        const W = 700,
            H = 400;
        const PLAYER_WIDTH = 32;
        const PLAYER_HEIGHT = 32;
        const PLAYER_SPEED = 5.5;
        const OBSTACLE_WIDTH = 20;
        const OBSTACLE_HEIGHT = 30;
        const COIN_SIZE = 18;

        // ----- Herní stav -----
        let player = { x: 80, y: H - 70, w: PLAYER_WIDTH, h: PLAYER_HEIGHT };
        let coins = [];
        let obstacles = [];
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let win = false;
        let frameId = null;
        let spawnCounter = 0;
        const SPAWN_RATE = 28;

        // Ovládání
        let keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            ArrowDown: false,
            a: false,
            d: false,
            w: false,
            s: false
        };

        // Joystick stav
        let joystickActive = false;
        let joystickDX = 0;
        let joystickDY = 0;
        const JOYSTICK_DEAD_ZONE = 0.1;
        let JOYSTICK_MAX_RADIUS = 35;

        // ----- Reset hry -----
        function resetGame() {
            if (frameId) {
                cancelAnimationFrame(frameId);
                frameId = null;
            }

            player.x = 80;
            player.y = H - 70;
            coins = [];
            obstacles = [];
            score = 0;
            lives = 3;
            gameOver = false;
            win = false;
            spawnCounter = 0;

            coinDisplay.textContent = '0';
            livesDisplay.textContent = '3';
            statusMsg.textContent = '🏁 Sbírej mince a vyhýbej se překážkám!';
            document.getElementById('restartBtn').disabled = false;

            for (let i = 0; i < 6; i++) {
                spawnCoin();
            }

            gameLoop();
        }

        // ----- Spawn mince -----
        function spawnCoin() {
            const x = Math.random() * (W - COIN_SIZE - 40) + 20;
            const y = Math.random() * (H - COIN_SIZE - 80) + 30;
            coins.push({
                x: x,
                y: y,
                r: COIN_SIZE / 2,
                collected: false
            });
        }

        // ----- Spawn překážky -----
        function spawnObstacle() {
            const x = W + 20;
            const y = Math.random() * (H - OBSTACLE_HEIGHT - 60) + 30;
            const speed = 2.2 + Math.random() * 1.8;
            obstacles.push({
                x: x,
                y: y,
                w: OBSTACLE_WIDTH,
                h: OBSTACLE_HEIGHT,
                speed: speed
            });
        }

        // ----- Kolize (AABB) -----
        function rectCollide(r1, r2) {
            return r1.x < r2.x + r2.w &&
                r1.x + r1.w > r2.x &&
                r1.y < r2.y + r2.h &&
                r1.y + r1.h > r2.y;
        }

        // ----- Herní update -----
        function update() {
            if (gameOver || win) return;

            // ----- Pohyb hráče (klávesy + joystick) -----
            let dx = 0,
                dy = 0;
            
            // Klávesy
            if (keys.ArrowLeft || keys.a) dx = -PLAYER_SPEED;
            if (keys.ArrowRight || keys.d) dx = PLAYER_SPEED;
            if (keys.ArrowUp || keys.w) dy = -PLAYER_SPEED;
            if (keys.ArrowDown || keys.s) dy = PLAYER_SPEED;

            // Joystick (pouze pokud není aktivní klávesový pohyb)
            if (dx === 0 && dy === 0 && joystickActive) {
                const magnitude = Math.sqrt(joystickDX * joystickDX + joystickDY * joystickDY);
                if (magnitude > JOYSTICK_DEAD_ZONE) {
                    const normalizedX = joystickDX / magnitude;
                    const normalizedY = joystickDY / magnitude;
                    const speed = Math.min(magnitude, 1) * PLAYER_SPEED;
                    dx = normalizedX * speed;
                    dy = normalizedY * speed;
                }
            }

            // Normalizace diagonálního pohybu
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }

            let newX = player.x + dx;
            let newY = player.y + dy;

            // Omezení v rámci canvasu
            if (newX < 2) newX = 2;
            if (newX + player.w > W - 2) newX = W - 2 - player.w;
            if (newY < 2) newY = 2;
            if (newY + player.h > H - 2) newY = H - 2 - player.h;

            player.x = newX;
            player.y = newY;

            // ----- Posun překážek doleva -----
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const ob = obstacles[i];
                ob.x -= ob.speed;

                if (ob.x + ob.w < 0) {
                    obstacles.splice(i, 1);
                    continue;
                }

                if (rectCollide(player, ob)) {
                    lives--;
                    livesDisplay.textContent = lives;
                    obstacles.splice(i, 1);
                    statusMsg.textContent = '💥 Ztráta života!';

                    if (lives <= 0) {
                        gameOver = true;
                        statusMsg.textContent = '💀 Konec hry! Klikni "Nová hra".';
                        return;
                    }
                    spawnCoin();
                    continue;
                }
            }

            // ----- Spawn nových překážek -----
            spawnCounter++;
            if (spawnCounter % SPAWN_RATE === 0 && obstacles.length < 8) {
                spawnObstacle();
            }

            // ----- Sbírání mincí -----
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                const dist = Math.hypot(
                    (player.x + player.w / 2) - coin.x,
                    (player.y + player.h / 2) - coin.y
                );

                if (dist < coin.r + Math.min(player.w, player.h) / 2.2) {
                    coins.splice(i, 1);
                    score++;
                    coinDisplay.textContent = score;
                    statusMsg.textContent = '🪙 +1 mince!';
                    spawnCoin();

                    if (score >= 20) {
                        win = true;
                        statusMsg.textContent = '🎉 VYHRÁL JSI! Nasbíral jsi 20 mincí! 🎉';
                        return;
                    }
                    continue;
                }
            }

            while (coins.length < 5) {
                spawnCoin();
            }
        }

        // ----- Vykreslení -----
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Pozadí
            ctx.strokeStyle = '#2a3f5a';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < H; i += 35) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(W, i);
                ctx.strokeStyle = 'rgba(60, 90, 120, 0.25)';
                ctx.stroke();
            }

            // ----- Hráč -----
            const px = player.x,
                py = player.y;
            const grad = ctx.createRadialGradient(px + 6, py + 6, 4, px + 16, py + 16, 24);
            grad.addColorStop(0, '#60a5fa');
            grad.addColorStop(0.7, '#2563eb');
            grad.addColorStop(1, '#1e3a8a');
            ctx.shadowColor = '#3b82f6';
            ctx.shadowBlur = 18;
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(px, py, player.w, player.h, 6);
            ctx.fill();
            ctx.shadowBlur = 0;

            // oči
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(px + 8, py + 8, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(px + 24, py + 8, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(px + 10, py + 8, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(px + 26, py + 8, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // ----- Mince -----
            for (const coin of coins) {
                const g = ctx.createRadialGradient(
                    coin.x - 4, coin.y - 4, 2,
                    coin.x, coin.y, coin.r
                );
                g.addColorStop(0, '#fde047');
                g.addColorStop(0.6, '#facc15');
                g.addColorStop(1, '#b45309');
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 16;
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,240,0.35)';
                ctx.beginPath();
                ctx.arc(coin.x - 4, coin.y - 5, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // ----- Překážky -----
            for (const ob of obstacles) {
                const g = ctx.createRadialGradient(
                    ob.x + 4, ob.y + 4, 3,
                    ob.x + 10, ob.y + 10, 20
                );
                g.addColorStop(0, '#f87171');
                g.addColorStop(0.5, '#dc2626');
                g.addColorStop(1, '#7f1d1d');
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 18;
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 5);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ob.x + 4, ob.y + 4);
                ctx.lineTo(ob.x + ob.w - 4, ob.y + ob.h - 4);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ob.x + ob.w - 4, ob.y + 4);
                ctx.lineTo(ob.x + 4, ob.y + ob.h - 4);
                ctx.stroke();
            }

            ctx.shadowBlur = 0;

            // ----- Herní stav -----
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fca5a5';
                ctx.font = 'bold 46px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💀 GAME OVER', W / 2, H / 2 - 10);
                ctx.font = '22px sans-serif';
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText('Klikni "Nová hra"', W / 2, H / 2 + 50);
            } else if (win) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fde047';
                ctx.font = 'bold 48px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🏆 VÍTĚZSTVÍ!', W / 2, H / 2 - 10);
                ctx.font = '24px sans-serif';
                ctx.fillStyle = '#f1f5f9';
                ctx.fillText('Nasbíral jsi 20 mincí! 🎉', W / 2, H / 2 + 50);
            }
        }

        // ----- Herní smyčka -----
        function gameLoop() {
            update();
            draw();
            frameId = requestAnimationFrame(gameLoop);
        }

        // ----- Ovládání kláves -----
        function handleKeyDown(e) {
            const key = e.key;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'a', 'd', 'w', 's'].includes(key)) {
                e.preventDefault();
                keys[key] = true;
                // Když se použijí klávesy, vypneme joystick
                joystickActive = false;
                resetJoystickKnob();
            }
            if (key === ' ' || key === 'Space') {
                e.preventDefault();
                if (gameOver || win) {
                    resetGame();
                }
            }
        }

        function handleKeyUp(e) {
            const key = e.key;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'a', 'd', 'w', 's'].includes(key)) {
                e.preventDefault();
                keys[key] = false;
            }
        }

        // ----- Joystick ovládání -----
        function resetJoystickKnob() {
            joystickKnob.style.transform = 'translate(-50%, -50%)';
            joystickDX = 0;
            joystickDY = 0;
            joystickContainer.classList.remove('active');
            joystickKnob.classList.remove('active');
        }

        function handleJoystickStart(e) {
            e.preventDefault();
            joystickActive = true;
            joystickContainer.classList.add('active');
            joystickKnob.classList.add('active');
            
            // Vypneme klávesy
            keys.ArrowLeft = false;
            keys.ArrowRight = false;
            keys.ArrowUp = false;
            keys.ArrowDown = false;
            
            const touch = e.touches ? e.touches[0] : e;
            updateJoystickPosition(touch);
        }

        function handleJoystickMove(e) {
            e.preventDefault();
            if (!joystickActive) return;
            const touch = e.touches ? e.touches[0] : e;
            updateJoystickPosition(touch);
        }

        function updateJoystickPosition(touch) {
            const rect = joystickContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = (touch.clientX - centerX);
            let dy = (touch.clientY - centerY);
            
            const maxRadius = JOYSTICK_MAX_RADIUS * (rect.width / 80);
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // Omezení na max radius
            let clampedDx = dx;
            let clampedDy = dy;
            if (distance > maxRadius) {
                clampedDx = (dx / distance) * maxRadius;
                clampedDy = (dy / distance) * maxRadius;
            }
            
            // Pohyb knoflíku
            joystickKnob.style.transform = `translate(${-50 + (clampedDx / rect.width * 100)}%, ${-50 + (clampedDy / rect.height * 100)}%)`;
            
            // Normalizované hodnoty pro pohyb (-1 až 1)
            const normalizedX = clampedDx / maxRadius;
            const normalizedY = clampedDy / maxRadius;
            
            joystickDX = Math.max(-1, Math.min(1, normalizedX));
            joystickDY = Math.max(-1, Math.min(1, normalizedY));
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            joystickActive = false;
            resetJoystickKnob();
        }

        // ----- Nastavení joystick eventů -----
        joystickContainer.addEventListener('touchstart', handleJoystickStart, { passive: false });
        joystickContainer.addEventListener('touchmove', handleJoystickMove, { passive: false });
        joystickContainer.addEventListener('touchend', handleJoystickEnd, { passive: false });
        joystickContainer.addEventListener('touchcancel', handleJoystickEnd, { passive: false });

        // Myš pro testování na PC (aby šel joystick vyzkoušet i na PC)
        let mouseJoystickActive = false;
        joystickContainer.addEventListener('mousedown', (e) => {
            mouseJoystickActive = true;
            handleJoystickStart(e);
        });
        window.addEventListener('mousemove', (e) => {
            if (mouseJoystickActive) {
                handleJoystickMove(e);
            }
        });
        window.addEventListener('mouseup', (e) => {
            if (mouseJoystickActive) {
                mouseJoystickActive = false;
                handleJoystickEnd(e);
            }
        });

        // ----- roundRect polyfill -----
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ----- Event listenery -----
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        document.getElementById('restartBtn').addEventListener('click', resetGame);

        resetGame();

        window.addEventListener('blur', () => {
            keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, a: false, d: false, w: false, s: false };
            joystickActive = false;
            resetJoystickKnob();
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Zobrazení nápovědy pro mobil
        if ('ontouchstart' in window) {
            statusMsg.textContent = '🕹️ Použij joystick vlevo dole pro pohyb!';
        }
    })();
</script>
</body>
</html>
